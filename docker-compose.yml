services:
  postgres:
    image: postgres:16-alpine
    container_name: mini_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mini_erp_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-mini_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mini_erp_app} -d ${DB_NAME:-mini_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mini_erp_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-my-super-secret-jwt-key-for-dev-1234}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mini_erp}
      DB_USER: ${DB_USER:-mini_erp_app}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-localTestPass123}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mini_erp_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
    name: mini_erp_pgdata
